name: Pipeline TB-DATASUS

# Referência: ADR-004. Roda em schedule + manualmente (workflow_dispatch).
# Janela de anos é fixa (2015-2024, ver pipeline/run_pipeline.py) — este
# workflow reprocessa dado já validado (captura consolidação de casos
# "provisórios" ao longo do tempo), não estende a janela sozinho.

on:
  schedule:
    # Mensal, dia 1, 06:00 UTC — dado de vigilância epidemiológica não
    # muda em escala de dias; mensal é suficiente para capturar
    # consolidação de casos sem gastar minutos de execução à toa.
    - cron: "0 6 1 * *"
  workflow_dispatch:  # permite rodar manualmente pela aba Actions
    inputs:
      # Override do volume_gate — só existe no gatilho manual; execuções
      # agendadas nunca o recebem. Desliga SÓ o gate de volume: as guardas
      # de catálogo, residência e duplicidade rodam dentro dos estágios e
      # não têm override.
      accept_volume_change:
        description: "Aceitar variação de volume acima do limite (exige justificativa)"
        type: boolean
        default: false
      volume_change_reason:
        description: "Justificativa (obrigatória se o override estiver ligado) — vai para o log e para a mensagem do commit"
        type: string
        default: ""

# Nota (2026-08-03): valor original de 45min foi estimativa não validada
# e causou cancelamento automático no meio da execução real (SIM sozinho,
# 251 downloads, ainda não tinha terminado aos 46min). 150min dá margem
# real folgada (~2x o estimado) sem chegar perto do limite de 6h por job
# do GitHub Actions. Sem custo adicional — minutos são gratuitos em
# repositório público independente da duração.
permissions:
  contents: write  # necessário para o commit automático dos parquets atualizados
  issues: write    # abrir/comentar issue quando o pipeline falha (ver último passo)

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # ver nota abaixo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes das guardas de qualidade
        run: python -m pytest -q tests

      - name: Rodar pipeline completo (bronze -> silver -> gold)
        env:
          PYTHONUNBUFFERED: "1"
          # Texto livre do usuário via env, nunca interpolado direto no script.
          ACCEPT: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_volume_change }}
          REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.volume_change_reason || '' }}
        run: |
          if [ "$ACCEPT" = "true" ]; then
            python pipeline/run_pipeline.py --stage all --accept-volume-change --volume-change-reason "$REASON"
          else
            python pipeline/run_pipeline.py --stage all
          fi

      - name: Commit e push dos artefatos atualizados
        env:
          ACCEPT: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_volume_change }}
          REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.volume_change_reason || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bronze/ silver/ gold/ quality/logs/
          git diff --staged --quiet && echo "Nenhuma mudança de dado — nada a commitar." && exit 0
          MSG="Automated pipeline run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          if [ "$ACCEPT" = "true" ] && grep -q '"status": "override"' quality/logs/volume_gate_decision.json; then
            MSG="$MSG [volume_gate override]"$'\n\n'"Volume change accepted manually. Reason: $REASON"
          fi
          git commit -m "$MSG"
          git push

      # Incidente 2026-10: um gate que bloqueia o commit protege o dashboard,
      # mas falha silenciosa deixaria o pipeline parado por meses sem ninguém
      # notar. Toda falha (testes, gate de volume, guardas, timeout) abre uma
      # issue — ou comenta na que já estiver aberta, para não duplicar.
      - name: Abrir issue em caso de falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          BODY="A execução $RUN_URL (gatilho: $EVENT) falhou — nada foi commitado, o dashboard segue com o último dado aprovado. Ver o log; se a causa for o volume_gate, procure por '[volume_gate] REPROVADO'."
          EXISTING=$(gh issue list --state open --label pipeline-failure --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create pipeline-failure --color d73a4a --description "Falha do pipeline agendado" --force
            gh issue create --title "Pipeline falhou ($(date -u +'%Y-%m-%d'))" --label pipeline-failure --body "$BODY"
          fi
